# gitleaks config — inherits the full stock ruleset, plus a narrow allowlist for
# the deterministic dummy encryption key used in tests and design docs. That value
# is an obvious non-secret placeholder (the byte pattern "a1b2c3d4e5f6" repeated),
# never a live credential, so it is allowlisted by its exact shape only.
[extend]
useDefault = true

[allowlist]
description = "Deterministic dummy encryption key in tests/docs (not a real secret)"
regexTarget = "match"
regexes = [
  '''(a1b2c3d4e5f6){2,}''',
]
