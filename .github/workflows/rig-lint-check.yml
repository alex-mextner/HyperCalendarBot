# Managed by Rig. Class: generated. Source of truth: global Rig config (lint_checks) + rig.yaml.
# Do not edit directly: `rig apply` reconciles the whole file (rig is installed from lint_checks.ci.rig_source).
name: rig-lint-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: 'GH-860 isolated hosted file-length proof; never merge this branch'
        required: true
        default: without-scratch
        type: choice
        options:
          - without-scratch
          - ok-1200
          - warn-1201
          - warn-2400
          - error-2401
          - json-2401

permissions:
  contents: read

jobs:
  lint-check:
    name: lint-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned cccc v1.8.4 (digest-verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/cccc.tar.gz" https://github.com/moznion/cccc/releases/download/v1.8.4/cccc-v1.8.4-x86_64-unknown-linux-musl.tar.gz
          echo "64b3084e05cf2f75d4af57268a2b898526c04be7bc31d0a36708081b13a64f97  $tmp/cccc.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/cccc.tar.gz" -C "$tmp" cccc
          echo "e09bc0ec6e9b8e55a57188b0137fdb38a11bba3cc115be8f6ef28df7f4a1d578  $tmp/cccc" | sha256sum -c -
          # the same lookup rig itself uses: ${XDG_DATA_HOME:-~/.local/share}/rig/cccc/v<version>/cccc
          dest="${XDG_DATA_HOME:-$HOME/.local/share}/rig/cccc/v1.8.4"
          mkdir -p "$dest"
          install -m 0755 "$tmp/cccc" "$dest/cccc"
      - name: Install rig from the pinned commit
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rig-venv"
          "$RUNNER_TEMP/rig-venv/bin/pip" install --quiet "git+https://git.hyperide.ai/ultrabricks/rig-cli@a71eb0a52e206aa2ee6bf824acfb7b8285c50ac9"
          echo "$RUNNER_TEMP/rig-venv/bin" >> "$GITHUB_PATH"
      - name: Generate the selected isolated file-length fixture
        if: github.event_name == 'workflow_dispatch'
        env:
          PROOF_CASE: ${{ inputs.case }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          cases = {
              "without-scratch": (None, 0, "none", 0),
              "ok-1200": ("docs/gh860-boundary.txt", 1200, "none", 0),
              "warn-1201": ("docs/gh860-boundary.txt", 1201, "warning", 0),
              "warn-2400": ("docs/gh860-boundary.txt", 2400, "warning", 0),
              "error-2401": ("docs/gh860-boundary.txt", 2401, "error", 1),
              "json-2401": ("docs/gh860-boundary.json", 2401, "exempt", 0),
          }
          case = os.environ["PROOF_CASE"]
          name, count, severity, expected_exit = cases[case]
          for candidate in ["docs/gh860-boundary.txt", "docs/gh860-boundary.json"]:
              if Path(candidate).exists():
                  raise RuntimeError(f"Refusing to overwrite an existing path: {candidate}")
          fixture = None
          if name is not None:
              if name.endswith(".json"):
                  text = "[\n" + ",\n".join("  0" for _ in range(count - 2)) + "\n]\n"
                  json.loads(text)
              else:
                  text = "".join(f"GH-860 hosted boundary line {i:04d}\n" for i in range(1, count + 1))
              payload = text.encode("utf-8")
              if len(payload.splitlines()) != count:
                  raise RuntimeError("Fixture line count mismatch")
              with Path(name).open("xb") as stream:
                  stream.write(payload)
              subprocess.run(["git", "add", "--", name], check=True)
              fixture = {"path": name, "physical_lines": count, "bytes": len(payload),
                         "sha256": hashlib.sha256(payload).hexdigest()}
          git = lambda *args: subprocess.check_output(["git", *args], text=True).strip()
          print(json.dumps({"task": "GH-860", "case": case, "head_sha": git("rev-parse", "HEAD"),
                            "head_tree": git("rev-parse", "HEAD^{tree}"), "fixture_index_tree": git("write-tree"),
                            "fixture": fixture, "expected_severity": severity,
                            "expected_lint_exit": expected_exit}, indent=2))
          PY
      - name: rig lint check
        env:
          PROOF_CASE: ${{ github.event_name == 'workflow_dispatch' && inputs.case || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PROOF_CASE" ]; then
            rig lint check --json
            exit 0
          fi
          proof_file="$RUNNER_TEMP/gh860-lint.json"
          if rig lint check --json > "$proof_file"; then
            lint_exit=0
          else
            lint_exit=$?
          fi
          cat "$proof_file"
          if python3 - "$PROOF_CASE" "$lint_exit" "$proof_file" <<'PY_VERIFY'
          #!/usr/bin/env python3
          """Verify the actual pinned Rig report for one hosted boundary case."""
          import json
          from pathlib import Path
          import subprocess
          import sys

          CASES = {
              'without-scratch': (None, 0, 'none', 0),
              'ok-1200': ('docs/gh860-boundary.txt', 1200, 'none', 0),
              'warn-1201': ('docs/gh860-boundary.txt', 1201, 'warning', 0),
              'warn-2400': ('docs/gh860-boundary.txt', 2400, 'warning', 0),
              'error-2401': ('docs/gh860-boundary.txt', 2401, 'error', 1),
              'json-2401': ('docs/gh860-boundary.json', 2401, 'exempt', 0),
          }


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def verify(report, case, actual_exit, *, scoped=False):
              name, lines, severity, expected_exit = CASES[case]
              require(report.get('schema') == 'rig-lint-check/v1', 'Unexpected pinned Rig report schema')
              require(report.get('exit_code') == actual_exit, 'Reported exit differs from the actual process exit')
              require(actual_exit == expected_exit, f'Expected native exit {expected_exit}, got {actual_exit}')
              require(report.get('ok') == (actual_exit == 0), 'Report ok flag disagrees with the actual exit')
              require(report.get('staged') is False, 'Expected a working-tree check of the runner fixture')
              require(report.get('incomplete') == [], 'The native check is incomplete')
              require(not report.get('error'), 'The native command reported an execution error')
              config = report['config']
              limits = config['file_lines']
              require(config['enabled'] and limits['enabled'], 'File-length checking is disabled')
              require(limits['warn_above'] == 1200 and limits['error_above'] == 2400, 'Boundary thresholds changed')
              require(limits['exempt_extensions'] == ['json'], 'Expected the configured JSON-only exemption')
              fixture_paths = {'docs/gh860-boundary.txt', 'docs/gh860-boundary.json'}
              findings = [item for item in report['findings'] if item['path'] in fixture_paths]
              skips = [item for item in report['skipped'] if item['path'] in fixture_paths]
              errors = [item for item in report['findings'] if item['severity'] == 'error']
              require(errors == (findings if severity == 'error' else []), 'An error outside the selected fixture invalidates the proof')
              if severity in {'warning', 'error'}:
                  require(len(findings) == 1, f'Expected exactly one fixture diagnostic, got {findings!r}')
                  finding = findings[0]
                  expected = {'rule': 'file-lines/max-lines', 'severity': severity, 'path': name,
                              'value': lines, 'limit': 1200 if severity == 'warning' else 2400}
                  require(all(finding.get(key) == value for key, value in expected.items()),
                          f'Fixture diagnostic differs: expected {expected!r}, got {finding!r}')
                  require(not skips, f'Text fixture was skipped: {skips!r}')
              else:
                  require(not findings, f'Unexpected fixture diagnostic: {findings!r}')
                  expected_skips = [{'path': name, 'check': 'file_lines', 'reason': 'exempt-extension'}] if severity == 'exempt' else []
                  require(skips == expected_skips, f'Fixture exemption differs: expected {expected_skips!r}, got {skips!r}')
              if scoped:
                  require(name is not None, 'A fixture-scoped report requires a selected fixture')
                  require(report['findings'] == findings and report['skipped'] == skips, 'Fixture-scoped report includes another path')
                  expected_count = 0 if severity == 'exempt' else 1
                  require(report['summary']['files_considered'] == expected_count,
                          f'Expected {expected_count} fixture files considered, got {report["summary"]["files_considered"]}')
                  expected_status = 'not-applicable' if severity == 'exempt' else 'fail' if severity == 'error' else 'pass'
                  require(report['checks']['file_lines']['status'] == expected_status, 'Fixture file-line check status differs')
              return {'proof': 'GH-860 hosted boundary verdict', 'case': case, 'ok': True,
                      'native_exit': actual_exit, 'fixture_findings': findings, 'fixture_skips': skips,
                      'files_considered': report['summary']['files_considered'], 'scope': 'fixture' if scoped else 'repository'}


          if __name__ == '__main__':
              case = sys.argv[1]
              result = verify(json.loads(Path(sys.argv[3]).read_text()), case, int(sys.argv[2]))
              name = CASES[case][0]
              if name is not None:
                  fixture_run = subprocess.run(['rig', 'lint', 'check', '--json', name], text=True, capture_output=True)
                  print(fixture_run.stdout, end='')
                  print(fixture_run.stderr, end='', file=sys.stderr)
                  result['fixture_scoped'] = verify(json.loads(fixture_run.stdout), case, fixture_run.returncode, scoped=True)
              print(json.dumps(result, sort_keys=True))
          PY_VERIFY
          then
            proof_exit=0
          else
            proof_exit=$?
          fi
          if [ "$proof_exit" -ne 0 ]; then
            echo "::error::GH-860 boundary proof failed (native lint exit $lint_exit)"
            exit 90
          fi
          exit "$lint_exit"
