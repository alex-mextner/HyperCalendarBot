# Type-ban gate: fail the PR when the ADDED TypeScript reintroduces a construct
# this repo has decided against — `as unknown as` in src/, `as never`,
# `Record<string, unknown>`, `z.unknown()`.
#
# CLAUDE.md states these in prose. Biome enforces the two it can express (`any`,
# `object`); this gate covers the rest, on ADDED lines only, so pre-existing debt
# blocks nobody.
#
# TAMPER-RESISTANCE — `pull_request_target`: a merge-blocking gate runs the
# trusted BASE-branch copy of its script, because a PR could otherwise edit the
# script to wave itself through. The PR's code is fetched as a git OBJECT and
# read as DATA by `git diff` + grep; it is never checked out and never executed.
#   HARD RULE: never add a build/test/install step here — that WOULD execute PR
#   code under the privileged trigger. This job only diffs and greps.
#   Caveat: it does NOT run on the PR that first adds it (base has no gate yet).

name: type-bans

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit SHA to scan (required for manual runs)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  type-bans:
    name: type-bans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BASE branch (trusted script) with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # codeql[actions/untrusted-checkout/medium]
      # Justified: under pull_request_target this fetches the PR head as a git OBJECT only —
      # never checked out, never executed (see the HARD RULE in the header). The PR content
      # is read as DATA by `git diff`/grep. Suppressed greppably rather than left to block.
      - name: Fetch the PR head commit as DATA (not checked out / not executed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          # No --depth: the gate runs a three-dot `git diff base...HEAD`, which needs a merge
          # base, and a shallow head has no reachable ancestry.
          git fetch --no-tags origin "$HEAD_SHA"

      # codeql[actions/cache-poisoning/poisonable-step]
      # Justified: runs only the trusted BASE-branch script over PR content as data; executes
      # no PR-controlled code and writes no cache.
      - name: Scan added lines for banned types
        env:
          TYPE_BANS_BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          TYPE_BANS_HEAD: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: bash ci/type-bans/type-bans.sh
