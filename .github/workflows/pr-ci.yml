name: PR CI

# The same gate deploy.yml's `test` job runs after merge (full `bun test`, `bun run lint`,
# `tsc --noEmit`), run on the pull request so a red suite is seen before `gh ship`.
# Same-repository PRs only: no secrets, no self-hosted runner, read-only token.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One frozen install of the committed lock; lifecycle scripts stay on, as in the plain
      # install it replaces. A plain `bun install` ahead of a frozen one rewrites bun.lock, so
      # the check then passes on a stale lock (#870).
      - run: bun install --frozen-lockfile
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: bunx playwright install --with-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: bun test
      - run: bun run lint
      - run: ./node_modules/.bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
