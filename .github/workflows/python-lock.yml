name: python-lock

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the lock generator
        run: python -m pip install uv==0.12.24
      - name: Verify the universal dependency lock
        run: |
          git ls-files --error-unmatch -- requirements.lock
          python3 scripts/compile-python-lock.py
          git diff --exit-code -- requirements.lock
