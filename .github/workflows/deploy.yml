name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for jobs that don't declare their own block (test,
# notify-failure). Jobs needing more (build: packages:write) override per-job.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hypercalendarbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      # Validate lockfile integrity (same platform — linux/linux)
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: bunx playwright install --with-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: bun test
      - run: bun run lint
      - run: ./node_modules/.bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact release artifact
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$RELEASE_IMAGE:$RELEASE_SHA"
          mkdir -p release/scripts
          docker save "$RELEASE_IMAGE:$RELEASE_SHA" | gzip -1 > release/image.tar.gz
          cp docker-compose.yml Caddyfile release/
          cp scripts/backup-db.sh scripts/healthcheck-alert.sh scripts/prepare-runtime-dirs.sh scripts/release-artifact.py scripts/deploy-prebuilt-image.sh scripts/migration-gate.py release/scripts/
          python3 scripts/release-artifact.py release/image.tar.gz "$RELEASE_SHA" "$RELEASE_IMAGE:$RELEASE_SHA" > release/artifact.json
          python3 -c 'import json; a=json.load(open("release/artifact.json")); print("archive_sha256="+a["archive_sha256"]); print("config_digest="+a["config_digest"])' >> "$GITHUB_OUTPUT"
      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: release
          target: ${{ secrets.DEPLOY_PATH }}/.incoming-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          timeout: 120s
          command_timeout: 10m
      - name: Release still targets main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"
      - name: Activate verified prebuilt release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_STAGE: .incoming-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          ARCHIVE_SUM: ${{ steps.release.outputs.archive_sha256 }}
          CONFIG_ID: ${{ steps.release.outputs.config_digest }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          envs: DEPLOY_PATH,RELEASE_STAGE,RELEASE_SHA,RELEASE_IMAGE,ARCHIVE_SUM,CONFIG_ID
          script: |
            set -eu
            REMOTE_SRC="$DEPLOY_PATH/$RELEASE_STAGE"
            bash "$REMOTE_SRC/scripts/deploy-prebuilt-image.sh" "$DEPLOY_PATH" "$REMOTE_SRC" "$RELEASE_IMAGE" "$RELEASE_SHA" "$ARCHIVE_SUM" "$CONFIG_ID"
      - name: Notify deploy success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '✅ <b>Deployed</b> <code>%s</code>\n%s' "${COMMIT_SHA:0:7}" "$FIRST_LINE")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML"}')"

  notify-failure:
    name: Notify on failure
    needs: [test, build, deploy]
    if: always() && (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ADMIN_ALERT_TOKEN: ${{ secrets.ADMIN_ALERT_TOKEN }}
        run: |
          FAILED=""
          [[ "$TEST_RESULT" == "failure" ]] && FAILED="test "
          [[ "$BUILD_RESULT" == "failure" ]] && FAILED+="build "
          [[ "$DEPLOY_RESULT" == "failure" ]] && FAILED+="deploy"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '🚨 <b>CI/CD failed</b> [%s]\n<code>%s</code> — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
          if [ -n "$ADMIN_ALERT_TOKEN" ]; then
            PLAIN=$(printf 'CI/CD failed [%s]\n%s — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
            curl -sf -X POST "https://hypercal.invntrm.ru/admin/alerts" \
              -H "Authorization: Bearer ${ADMIN_ALERT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$PLAIN" --arg source "ci" '{text: $text, source: $source}')" || true
          fi
