name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for jobs that don't declare their own block (test,
# notify-failure). Jobs needing more (build: packages:write) override per-job.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hypercalendarbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      # Validate lockfile integrity (same platform — linux/linux)
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: bunx playwright install --with-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: bun test
      - run: bun run lint
      - run: ./node_modules/.bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    needs: test
    # Production runs on the home ODROID-N2+ (aarch64) since 2026-10-09 (#784): build the
    # arm64 image natively on GitHub's free arm runner instead of emulating it.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      archive_sha256: ${{ steps.release.outputs.archive_sha256 }}
      config_digest: ${{ steps.release.outputs.config_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
      # The odroid runner has no docker access and no registry credentials: it receives the
      # exact image as a checksummed docker-save archive and only ever loads that.
      - name: Prepare exact release artifact
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$RELEASE_IMAGE:$RELEASE_SHA"
          mkdir -p release/scripts
          docker save "$RELEASE_IMAGE:$RELEASE_SHA" | gzip -1 > release/image.tar.gz
          cp docker-compose.yml Caddyfile release/
          cp scripts/backup-db.sh scripts/healthcheck-alert.sh scripts/prepare-runtime-dirs.sh scripts/release-artifact.py scripts/deploy-prebuilt-image.sh scripts/migration-gate.py release/scripts/
          python3 scripts/release-artifact.py release/image.tar.gz "$RELEASE_SHA" "$RELEASE_IMAGE:$RELEASE_SHA" > release/artifact.json
          python3 -c 'import json; a=json.load(open("release/artifact.json")); print("archive_sha256="+a["archive_sha256"]); print("config_digest="+a["config_digest"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 3
          # image.tar.gz is already gzip-compressed.
          compression-level: 0

  deploy:
    needs: build
    # Self-hosted runner on the odroid (user hcb-runner, no docker group). Only pushes to
    # main reach it; no pull_request-triggered workflow may ever target this label.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, odroid-hcb]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Clear previous release files
        run: rm -rf release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: release
      # The odroid is a shared multi-user box where any local user can read process argument
      # lists, so tokens stay in the environment and the request is made inside python3.
      - name: Release still targets main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              main_sha = json.load(response)["object"]["sha"]
          if main_sha != os.environ["EXPECTED_SHA"]:
              sys.exit(f"main moved to {main_sha}; not deploying {os.environ['EXPECTED_SHA']}")
          PY
      - name: Activate verified prebuilt release
        env:
          RELEASE_SHA: ${{ github.sha }}
          ARCHIVE_SUM: ${{ needs.build.outputs.archive_sha256 }}
          CONFIG_ID: ${{ needs.build.outputs.config_digest }}
        # Root wrapper installed by hand on the odroid (runbook "Odroid runner"): it copies the
        # known release files into a root-owned stage and runs scripts/deploy-prebuilt-image.sh there.
        run: sudo -n /usr/local/sbin/hypercal-activate-release "$PWD/release" "$RELEASE_SHA" "$ARCHIVE_SUM" "$CONFIG_ID"
      - name: Remove release files
        if: always()
        run: rm -rf release
      - name: Notify deploy success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        # Same reason: BOT_TOKEN would sit in a curl URL argument. A failed notification
        # only warns, as the curl version did for HTTP errors.
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          first = os.environ["COMMIT_MSG"].split("\n")[0]
          body = json.dumps({
              "chat_id": os.environ["ADMIN_ID"],
              "text": "✅ <b>Deployed</b> <code>%s</code>\n%s" % (os.environ["COMMIT_SHA"][:7], first),
              "parse_mode": "HTML",
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data=body, headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(request, timeout=30).close()
          except Exception as error:
              print(f"::warning::deploy notification failed: {type(error).__name__}")
          PY

  notify-failure:
    name: Notify on failure
    needs: [test, build, deploy]
    if: always() && (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ADMIN_ALERT_TOKEN: ${{ secrets.ADMIN_ALERT_TOKEN }}
        run: |
          FAILED=""
          [[ "$TEST_RESULT" == "failure" ]] && FAILED="test "
          [[ "$BUILD_RESULT" == "failure" ]] && FAILED+="build "
          [[ "$DEPLOY_RESULT" == "failure" ]] && FAILED+="deploy"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '🚨 <b>CI/CD failed</b> [%s]\n<code>%s</code> — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
          if [ -n "$ADMIN_ALERT_TOKEN" ]; then
            PLAIN=$(printf 'CI/CD failed [%s]\n%s — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
            curl -sf -X POST "https://hypercal.invntrm.ru/admin/alerts" \
              -H "Authorization: Bearer ${ADMIN_ALERT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$PLAIN" --arg source "ci" '{text: $text, source: $source}')" || true
          fi
