name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for jobs that don't declare their own block (test,
# notify-failure). Jobs needing more (build: packages:write) override per-job.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hypercalendarbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      # Validate lockfile integrity (same platform — linux/linux)
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: bunx playwright install --with-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium-headless-shell
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: bun test
      - run: bun run lint
      - run: ./node_modules/.bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml,Caddyfile,scripts/backup-db.sh,scripts/healthcheck-alert.sh
          target: ${{ secrets.DEPLOY_PATH }}
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          envs: GH_TOKEN
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x scripts/backup-db.sh scripts/healthcheck-alert.sh
            echo "$GH_TOKEN" | docker login ghcr.io -u github --password-stdin
            # Clean up old images to prevent "no space left on device"
            docker image prune -f
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            # Generate stress dictionary if missing (one-time, ~15MB)
            if [ ! -f data/dictionaries/stress-dict.json ]; then
              mkdir -p data/dictionaries
              rm -rf /tmp/russian-dictionary
              git clone --depth 1 https://github.com/Badestrand/russian-dictionary /tmp/russian-dictionary
              docker run --rm \
                -v "$(pwd)/data":/app/data \
                -v /tmp/russian-dictionary:/tmp/russian-dictionary \
                ghcr.io/${{ env.IMAGE_NAME }}:latest bun scripts/generate-stress-dict.ts
              rm -rf /tmp/russian-dictionary
            fi
            # Ensure data dir is owned by botuser (uid=999) — docker run --rm above
            # creates files as root, causing SQLITE_READONLY on startup.
            chown -R 999:999 data/

            echo "📜 Rotating logs before restart..."
            STAMP=$(date +%Y-%m-%d_%H-%M-%S)
            mkdir -p logs
            for f in healthcheck.log backup.log; do
              if [ -s "logs/$f" ]; then
                mv "logs/$f" "logs/${f%.log}_${STAMP}.log"
                gzip "logs/${f%.log}_${STAMP}.log"
              fi
            done

            docker compose up -d --no-deps bot
            caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true

            # The reload above cannot fail the deploy: this server is shared, and
            # another project's broken config would take our deploy down with it.
            # So check the outcome instead. An unrouted path does not 404 here —
            # the proxy answers it with the static page, 200, which is what kept
            # the watchdog blind while every check was green.
            echo "🔎 Verifying the readiness path is routed to the bot..."
            ROUTED=""
            for _ in $(seq 1 10); do
              BODY=$(curl -s --max-time 20 https://hypercal.invntrm.ru/ready || true)
              case "$BODY" in
                ok|"ok (unverified)"|"ai chain down") ROUTED="$BODY"; break ;;
              esac
              sleep 6
            done
            if [ -z "$ROUTED" ]; then
              echo "❌ /ready is not reaching the bot — the watchdog would see this as healthy. Last body: ${BODY:-<empty>}"
              exit 1
            fi
            echo "✅ /ready routed to the bot: $ROUTED"
      - name: Notify deploy success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '✅ <b>Deployed</b> <code>%s</code>\n%s' "${COMMIT_SHA:0:7}" "$FIRST_LINE")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML"}')"

  notify-failure:
    name: Notify on failure
    needs: [test, build, deploy]
    if: always() && (needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ADMIN_ALERT_TOKEN: ${{ secrets.ADMIN_ALERT_TOKEN }}
        run: |
          FAILED=""
          [[ "$TEST_RESULT" == "failure" ]] && FAILED="test "
          [[ "$BUILD_RESULT" == "failure" ]] && FAILED+="build "
          [[ "$DEPLOY_RESULT" == "failure" ]] && FAILED+="deploy"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          TEXT=$(printf '🚨 <b>CI/CD failed</b> [%s]\n<code>%s</code> — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$ADMIN_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
          if [ -n "$ADMIN_ALERT_TOKEN" ]; then
            PLAIN=$(printf 'CI/CD failed [%s]\n%s — %s\n%s' "$FAILED" "${COMMIT_SHA:0:7}" "$FIRST_LINE" "$RUN_URL")
            curl -sf -X POST "https://hypercal.invntrm.ru/admin/alerts" \
              -H "Authorization: Bearer ${ADMIN_ALERT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$PLAIN" --arg source "ci" '{text: $text, source: $source}')" || true
          fi
