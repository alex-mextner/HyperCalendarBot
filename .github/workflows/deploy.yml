name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hypercalendarbot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install
      - run: sha256sum bun.lock > /tmp/lock-after-install.txt && cat /tmp/lock-after-install.txt
      - run: bun install --frozen-lockfile --ignore-scripts
        name: Verify lockfile is self-consistent
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: bun test
      # Upload linux-resolved lockfile for Docker build
      - uses: actions/upload-artifact@v4
        with:
          name: bun-lock-linux
          path: bun.lock
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Replace macOS lockfile with linux-resolved one
      - uses: actions/download-artifact@v4
        with:
          name: bun-lock-linux
      - run: sha256sum bun.lock
        name: Verify artifact lockfile checksum
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml,Caddyfile
          target: ${{ secrets.DEPLOY_PATH }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose down --remove-orphans || true
            docker compose up -d
            caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
