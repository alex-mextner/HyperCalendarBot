# actionlint config: custom labels of this repository's self-hosted runners. Without them actionlint
# rejects `runs-on: [self-hosted, <label>]` as an unknown label (it only knows GitHub-hosted ones).
#
# Both labels were read from the runners registered on the repository
# (`gh api repos/alex-mextner/HyperCalendarBot/actions/runners`); add a label here only when a
# registered runner actually carries it:
#   odroid-hcb  label of the runner named `odroid-hcb` (Linux ARM64), the home ODROID-N2+ — deploy.yml
#   stage-qa    label of the runner named `odroid-hcb-qa` (Linux ARM64), the odroid's Stage QA runner — stage-qa.yml
self-hosted-runner:
  labels:
    - odroid-hcb
    - stage-qa
