# rig.yaml — REPO-LEVEL config only.
# The machine-wide installs (skills, agent-hooks, git-hooks dispatcher, MCP, harness
# auto-mode) live in the GLOBAL layer ~/.config/rig/config.yaml and are NOT repeated here.
# This file holds only what is specific to THIS repo (CI gates, repo settings). The cascade
# is by LOCATION: global is global, this committed file is the repo and overrides it.
# Apply: rig apply.  Drift: rig status.
#
# This is a TypeScript/bun Telegram bot. It already ships its own deploy + image CI
# (.github/workflows/deploy.yml, ci-image.yml) and a local lefthook biome/tsc gate, so the
# rig `tests` gate (pytest-only) is intentionally NOT enabled here — these gates are the
# language-agnostic security/hygiene + merge layer on top of the repo's own build/test CI.

version: 1
ci:
  enabled: true
  target: .github/workflows
  all: false
  items:
    secret-scan:
      enabled: true
      tier: block
    codeql:
      enabled: true
      tier: block
      variant: selfgate
    dependency-review:
      enabled: true
      tier: block
    leftover-grep:
      enabled: true
      tier: block
    review-threads:
      enabled: true
      tier: block
    ship:
      enabled: true
      install_to: ~/bin
      gh_alias: true

# cccc complexity + file-length gate (`rig lint check`). Explicit here so the repo's thresholds
# are visible; they equal the global defaults. Only .json is exempt from the line limit, so the
# generated uv.lock (1343 lines) stays a standing warning by design: do not exempt `lock`.
lint_checks:
  enabled: true
  complexity:
    enabled: true
    max_cognitive: 15
    max_cyclomatic: 20
  file_lines:
    enabled: true
    warn_above: 1200
    error_above: 2400
    exempt_extensions: [json]
