name: hypercalinvntrmru

services:
  redis:
    image: redis:7-alpine
    container_name: hypercal-redis
    restart: unless-stopped
    # The password must never reach argv: on this shared host `ps` shows every
    # process's command line to all local users. redis-cli reads REDISCLI_AUTH,
    # and redis-server reads its requirepass line from stdin (the trailing `-`),
    # fed by a heredoc; variable expansion and heredocs are shell builtins, so no
    # process ever carries the password as an argument. docker-entrypoint.sh then
    # drops to the redis user exactly as it does for a plain `redis-server` command.
    # The value goes into a double-quoted redis.conf string, where `"` and `\`
    # would be read as syntax, so such a password stops the container loudly
    # instead of starting redis with a different password. The old string
    # command could not carry those characters either. The bot's REDIS_URL embeds
    # the password without percent-encoding, where `/`, `?`, `#` and `%` break or
    # rewrite it and URL parsing drops tab, CR and LF, so those stop the container
    # too. An empty value would mean `requirepass ""` (no auth at all), so an unset
    # password stops it too.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        # The trailing '.' keeps $$() from stripping the LF; $${ctl%.} removes it again.
        ctl=$$(printf '\t\r\n.'); ctl=$${ctl%.}
        case "$$REDISCLI_AUTH" in
          '') echo 'REDIS_PASSWORD must be set' >&2; exit 1 ;;
          *[\"\\]*) echo 'REDIS_PASSWORD must not contain a double quote or backslash' >&2; exit 1 ;;
          *[/?#%]*) echo 'REDIS_PASSWORD must not contain / ? # or % (REDIS_URL embeds it unencoded)' >&2; exit 1 ;;
          *[$$ctl]*) echo 'REDIS_PASSWORD must not contain a tab, CR or LF (REDIS_URL parsing drops them)' >&2; exit 1 ;;
        esac
        exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 200mb --maxmemory-policy noeviction - <<EOF
        requirepass "$$REDISCLI_AUTH"
        EOF
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  bot:
    image: ghcr.io/alex-mextner/hypercalendarbot:latest
    container_name: hypercal-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # env_file passes every .env key; the bot only reads REDIS_URL, so blank the bare password.
      - REDIS_PASSWORD=
      - NODE_ENV=production
    ports:
      - "3001:3311"
    # Chromium (Playwright) needs more than Docker's default 64MB /dev/shm
    shm_size: '256m'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3311/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # The home ODROID-N2+ (6 cores, 3.7 GB RAM) hosts this bot since 2026-10-09, shared
    # with ExpenseSyncBot, HyperSummaryBot, Home Assistant and others: 1.5 CPUs leaves them
    # headroom. RAM there is overcommitted (2 GB in swap on 2026-10-10, the idle bot down to
    # 71 MB resident), so the reservation (cgroup memory.low) keeps the bot's working set out
    # of reclaim and the next message is not served from swap; it never causes an OOM kill.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
        reservations:
          memory: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis-data:
